<title>덤프에서 사장까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Nanum+Gothic+Coding:wght@400;700&family=Silkscreen&display=swap">
<style>
/* Layout: one SAP GUI-style window — title bar, T-code field, pixel office stage + career ladder + T-code action pad on the left, employee record on the right, S/W/E/I status bar at the bottom */
:root{
  --ink:#0d131d;
  --panel:#161f2d;
  --raise:#1e2a3c;
  --line:#2c3a52;
  --text:#e6ebf2;
  --muted:#8796ad;
  --stat:#c3cede;
  --gold:#f2b33d;
  --gold-dim:#3a2f12;
  --blue:#5aa8ff;
  --ok:#5fd38d; --warn:#f2c84b; --bad:#ff6b6b;
  --shadow:#05080d;
  --scrim:rgba(5,8,13,.8);
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Nanum Gothic Coding","D2Coding","Apple SD Gothic Neo",ui-monospace,monospace;
  --f-pixel:"Silkscreen","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--text);font:14px/1.5 var(--f-body);padding-inline:16px;padding-block:20px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.win{max-width:1060px;margin:0 auto;background:var(--panel);border:2px solid var(--line);box-shadow:6px 6px 0 var(--shadow)}
.titlebar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--raise);border-bottom:2px solid var(--line)}
.logo{width:14px;height:14px;flex:none;background:var(--gold);box-shadow:inset -3px -3px 0 var(--gold-dim)}
.titlebar h1{margin:0;font:400 22px/1 var(--f-display);letter-spacing:.5px}
.titlebar .sid{margin-left:auto;font:10px var(--f-pixel);color:var(--muted);letter-spacing:1.5px;white-space:nowrap}
.cmdbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:2px solid var(--line)}
.cmd{display:flex;gap:6px;align-items:center;flex:1 1 240px;min-width:0}
.cmd label{font:10px var(--f-pixel);color:var(--muted);letter-spacing:1px}
.cmd input{flex:1;min-width:0;max-width:200px;background:var(--ink);border:2px solid var(--line);padding:5px 8px;font:13px var(--f-pixel);text-transform:uppercase;letter-spacing:1px}
.btn{background:var(--raise);border:2px solid var(--line);padding:5px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--shadow)}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.ok{color:var(--ok)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:14px}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;border:2px solid var(--line);background:var(--shadow);aspect-ratio:16/9;max-width:100%;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:manipulation}
.stage.mini canvas{cursor:crosshair}
.stagehud{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;gap:8px;padding:6px 10px;font:12px var(--f-pixel);color:var(--text);background:var(--scrim);pointer-events:none}
.floater{position:absolute;font:20px/1 var(--f-display);pointer-events:none;text-shadow:2px 2px 0 var(--shadow);white-space:nowrap;transform:translateX(-50%);animation:rise 1.5s steps(12) forwards}
.floater.pos{color:var(--ok)} .floater.neg{color:var(--bad)} .floater.gold{color:var(--gold)}
@keyframes rise{from{opacity:1;translate:0 0}to{opacity:0;translate:0 -48px}}
.ladder{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;margin-top:10px}
.ladder div{font:14px/1 var(--f-display);text-align:center;padding:7px 0 6px;border:2px solid var(--line);color:var(--muted);white-space:nowrap;overflow:hidden}
.ladder .done{background:var(--raise);color:var(--text)}
.ladder .now{background:var(--gold);border-color:var(--gold);color:var(--ink)}
@media (max-width:480px){.ladder div{font-size:11px;padding-inline:0}}
.pad-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px;margin:16px 0 8px}
.pad-head h2{margin:0;font:400 19px var(--f-display)}
.slots{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.slot{width:12px;height:12px;border:2px solid var(--gold)}
.slot.full{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:8px}
.act{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;align-items:center;text-align:left;background:var(--raise);border:2px solid var(--line);padding:8px 10px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow)}
.act .tc{grid-row:1/3;font:10px var(--f-pixel);color:var(--blue);border:2px solid currentColor;padding:4px 3px;min-width:48px;text-align:center;letter-spacing:.5px}
.act .nm{font:17px/1.2 var(--f-display)}
.act .fx{font-size:11px;color:var(--muted);line-height:1.35}
.act:hover:not(:disabled){border-color:var(--blue)}
.act:active:not(:disabled){transform:translate(3px,3px);box-shadow:none}
.act:disabled{cursor:not-allowed;opacity:.4}
.act.locked{opacity:.5}
.act.locked .tc{color:var(--muted)}
.act.promo{border-color:var(--gold)}
.act.promo .tc{color:var(--gold)}
.act.promo.ready{animation:glow 1s steps(2) infinite}
@keyframes glow{50%{background:var(--gold-dim)}}
.hud{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{border:2px solid var(--line);background:var(--raise);padding:12px 14px;min-width:0}
.eyebrow{font:10px var(--f-pixel);letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.rankname{font:400 25px/1.15 var(--f-display);color:var(--gold);text-wrap:balance;margin:4px 0}
.meta{font-size:12px;color:var(--muted)}
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:56px minmax(0,1fr) 28px;align-items:center;gap:8px;font-size:12px}
.bar .track{height:12px;background:var(--ink);border:2px solid var(--line);position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--stat)}
.bar .track::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 7px,var(--ink) 7px 9px)}
.bar.hp .fill{background:var(--ok)} .bar.mp .fill{background:var(--blue)} .bar.low .fill{background:var(--bad)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.bars hr{border:0;border-top:2px dashed var(--line);margin:3px 0;width:100%}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.totals b{display:block;font:400 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.next{font:400 18px/1.3 var(--f-display);margin-top:4px}
.reqs{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px;font-size:12px}
.reqs li{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.reqs .y{color:var(--ok)} .reqs .n{color:var(--muted)}
.log{list-style:none;margin:8px 0 0;padding:0;font-size:12px;display:grid;gap:5px;max-height:190px;overflow:auto}
.log li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px;align-items:start}
.mt{display:inline-block;font:10px/16px var(--f-pixel);width:16px;height:16px;text-align:center;color:var(--ink);flex:none}
.mt.S{background:var(--ok)} .mt.W{background:var(--warn)} .mt.E{background:var(--bad)} .mt.I{background:var(--blue)}
.statusbar{display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:2px solid var(--line);background:var(--raise);font-size:13px;min-height:34px}
#smsg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statusbar .sys{font:10px var(--f-pixel);color:var(--muted);white-space:nowrap;letter-spacing:1px}
@media (max-width:560px){.statusbar .sys{display:none}}
.overlay{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;padding:16px;z-index:10}
.modal{width:min(520px,100%);background:var(--panel);border:2px solid var(--gold);box-shadow:6px 6px 0 var(--shadow);max-height:calc(100% - 16px);overflow:auto}
.modal header{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--raise);border-bottom:2px solid var(--line);font:10px var(--f-pixel);color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.modal .body{padding:16px 18px 18px;display:grid;gap:12px}
.modal h3{margin:0;font:400 28px/1.2 var(--f-display);text-wrap:balance}
.modal p{margin:0;max-width:60ch}
.choices{display:grid;gap:8px;margin-top:4px}
.choice{text-align:left;background:var(--raise);border:2px solid var(--line);padding:10px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);display:grid;gap:2px}
.choice:hover{border-color:var(--gold)}
.choice:active{transform:translate(3px,3px);box-shadow:none}
.choice b{font:400 19px var(--f-display)}
.choice small{color:var(--muted);font-size:12px}
.field{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.field input{background:var(--ink);border:2px solid var(--line);padding:8px 10px;font-size:15px}
.summary{display:grid;grid-template-columns:1fr auto;gap:5px 14px;font-size:13px;margin:0}
.summary dt{color:var(--muted)}
.summary dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
@media (prefers-reduced-motion:reduce){
  .floater{animation:fade 1.5s forwards}
  .act.promo.ready{animation:none;background:var(--gold-dim)}
  @keyframes fade{to{opacity:0}}
}
</style>

 for(let i=m.splats.length-1;i>=0;i--){const p=m.splats[i],a=now-p.t;if(a>450){m.splats.splice(i,1);continue;}
  const r=1+Math.floor(a/90),c=p.gold?'#f2b33d':'#5fd38d';R(p.x-r,p.y,1,1,c);R(p.x+r,p.y,1,1,c);R(p.x,p.y-r,1,1,c);R(p.x,p.y+r,1,1,c);R(p.x-r+1,p.y-r+1,1,1,c);R(p.x+r-1,p.y+r-1,1,1,c);}

let S=null,busy=false;
const KEY='dump2ceo.v1';
function fresh(name){return {v:1,name:name||'김사원',turn:0,slot:0,rank:0,abap:3,know:2,net:2,lead:0,hp:100,mp:80,perf:0,money:200,log:[],over:null,lastAuth:null,lastEv:null,st:{code:0,bugs:0,acts:0,events:0}};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.v===1?s:null;}catch(e){return null;}}
const year=t=>2026+Math.floor(t/2), half=t=>t%2?'하반기':'상반기', age=t=>26+Math.floor(t/2);
const mult=()=>1+.15*S.rank;

function apply(eff,m=1){
 const out=[];
 for(const k in eff){let v=eff[k];if(Array.isArray(v))v=rnd(v[0],v[1]);if(k==='perf'&&v>0)v=Math.round(v*m);
  if(k==='money')S.money+=v;else if(k==='perf'){v=Math.max(-S.perf,v);S.perf+=v;}else{const nv=clamp(S[k]+v,0,100);v=nv-S[k];S[k]=nv;}
  if(v)out.push([k,v]);}
 return out;
}
function fxText(eff,m=1){
 return Object.entries(eff).map(([k,v])=>{let [a,b]=Array.isArray(v)?v:[v,v];if(k==='perf'&&a>0){a=Math.round(a*m);b=Math.round(b*m);}
  const sg=a>0?'+':'';return `${STAT[k]} ${a===b?sg+a:`${sg}${a}~${b}`}${k==='money'?'만':''}`;}).join(' · ');
}
function actEff(a){const e={};for(const k in a.cost)e[k]=-a.cost[k];return Object.assign(e,a.gain);}
function later(f,ms=800){busy=true;setTimeout(()=>{busy=false;f();},ms);}
function status(t,m){const el=$('smt');el.className='mt '+t;el.textContent=t;$('smsg').textContent=m;}
function log(t,m){S.log.unshift({t,m,d:`${String(year(S.turn)).slice(2)}${half(S.turn)[0]}`});S.log.length=Math.min(S.log.length,30);status(t,m);}
function float(res){
 res.forEach(([k,v],i)=>setTimeout(()=>{const el=document.createElement('span');
  el.className='floater '+(v<0?'neg':k==='perf'||k==='money'?'gold':'pos');
  el.textContent=`${STAT[k]} ${v>0?'+':''}${k==='money'?fmt(v)+'만':v}`;
  el.style.left=(50+(Math.random()*24-12))+'%';el.style.top=(26+i*3)+'%';
  $('stage').appendChild(el);setTimeout(()=>el.remove(),1600);},i*200));
}
function reqStatus(){const r=RANKS[S.rank].req;return r?Object.entries(r).map(([k,v])=>({k,v,cur:S[k],ok:S[k]>=v})):null;}
const canPromote=()=>{const r=reqStatus();return !!r&&r.every(x=>x.ok);};
const modalOpen=()=>!$('ov').hidden;

function doAction(id){
 if(S.over)return status('E','게임이 끝났습니다. [새로 입사]를 눌러 다시 시작하세요');
 if(busy||mini||modalOpen())return;
 const a=ACT[id];
 if(a.promo)return tryPromote();
 if(S.rank<a.min){S.lastAuth=a.tc;save();return status('E',`트랜잭션 ${a.tc}에 대한 권한이 없습니다 (${RANKS[a.min].s}부터 사용 가능)`);}
 if(a.cost.money&&S.money<a.cost.money)return status('E','자산이 부족합니다');
 if(a.mini)return startMini();
 const res=apply(actEff(a),mult());let msg=pick(a.msgs);
 if(id==='code'&&S.rank>=6){msg='임원이 직접 코딩하자 팀원들이 긴장합니다';res.push(...apply({lead:-1}));}
 S.st.acts++;if(id==='code')S.st.code++;
 anim(a.anim,a.anim==='rest'?2400:1800);float(res);log(id==='rest'?'I':'S',msg);

}
function advance(){
 S.slot++;
 if(S.mp<=0){save();ui();return later(()=>ending('quit'));}
 if(S.hp<=0){save();ui();return burnout();}
 if(S.slot>=3)endTurn();
 save();ui();
}
function endTurn(){
 const pay=Math.round(RANKS[S.rank].pay/2);
 S.money+=pay;S.hp=clamp(S.hp+12,0,100);S.mp=clamp(S.mp+5,0,100);
 log('I',`${year(S.turn)}년 ${half(S.turn)} 마감 · 급여 ${fmt(pay)}만원 입금`);
 S.turn++;S.slot=0;
 if(S.turn>=MAXTURN){save();ui();return later(()=>ending('retire'));}
 if(Math.random()<.6){const pool=EVENTS.filter(e=>S.rank>=e.r[0]&&S.rank<=e.r[1]&&e.t!==S.lastEv);if(pool.length){const ev=pick(pool);later(()=>showEvent(ev),900);}}
 save();ui();
}
function post(){

}

}

 const m=mult(),ready=canPromote();
 for(const a of ACTS){const b=padEls[a.id],fx=b.querySelector('.fx');
  if(a.promo){b.hidden=S.rank>=9;b.classList.toggle('ready',ready&&!S.over);fx.textContent=ready?'조건 충족 · 지금 승진 신청':'조건을 모두 채우면 열립니다';}
  else{const lock=S.rank<a.min;b.classList.toggle('locked',lock);
   fx.textContent=lock?`${RANKS[a.min].s}부터 · 권한 없음`:a.mini?`체력 -${a.cost.hp} · 버그당 성과 +${(1.2*m).toFixed(1)}`:fxText(actEff(a),m);}
  b.disabled=!!S.over;}
 $('log').innerHTML=S.log.slice(0,14).map(l=>`<li><span class="mt ${l.t}">${l.t}</span><span><span class="meta">${l.d}</span> ${esc(l.m)}</span></li>`).join('');
 $('ssys').textContent=`DEV(1)/100 · ${S.name}`;
}

// ───────── 입력 ─────────
function runT(raw){
 let s=raw.trim().toUpperCase().replace(/\s+/g,'');if(!s)return;
 if(s.startsWith('/N')||s.startsWith('/O'))s=s.slice(2);
 const a=ACTS.find(x=>x.tc===s||x.tc==='/'+s)||ACT[ALIAS[s]];
 if(a)return doAction(a.id);
 const egg=EGGS[s];if(egg){const [t,m]=typeof egg==='function'?egg():egg;return status(t,m);}
 status('E',`트랜잭션 ${s}이(가) 존재하지 않습니다`);
}
$('cmdform').addEventListener('submit',e=>{e.preventDefault();const v=$('tcode').value;$('tcode').value='';runT(v);});
$('helpbtn').addEventListener('click',()=>{if(!mini)help();});
$('newbtn').addEventListener('click',()=>{if(!mini)intro();});
document.addEventListener('keydown',e=>{
 if(e.key==='/'&&!modalOpen()&&!mini&&document.activeElement!==$('tcode')&&!/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'')){e.preventDefault();$('tcode').focus();}
});

// ───────── 루프 · 부팅 ─────────
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 try{if(mini)drawMini(now,dt);else drawScene(now,dt);}catch(err){console.error(err);}
 requestAnimationFrame(loop);}
function boot(data){
 S=(data&&data.S)||load();const isNew=!S;if(!S)S=fresh();
 buildPad();ui();requestAnimationFrame(loop);
 if(isNew)intro();else if(S.over)ending(S.over);
 else status('I',`${S.name} 님, 다시 오신 걸 환영합니다. ${year(S.turn)}년 ${half(S.turn)}입니다`);
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
})();
</script>
